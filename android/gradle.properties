android.useAndroidX=true
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED -Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.vfs.watch=false
# AGP 9 built-in Kotlin is supported by Flutter 3.47+.
android.builtInKotlin=true
# Retain the legacy Android DSL required by Flutter plugins.
android.newDsl=false
